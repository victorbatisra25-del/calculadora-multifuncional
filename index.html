<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Multifuncional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculadora">
        <!-- Switch de Tema Claro/Escuro -->
        <div class="theme-switch-container">
            <label class="theme-switch">
                <input type="checkbox" id="theme-toggle">
                <span class="slider"></span>
            </label>
        </div>

        <h1>Calculadora</h1>
        
        <div class="input-group">
            <label for="numero1">Número 1</label>
            <input type="number" id="numero1" placeholder="Digite o primeiro número">
        </div>

        <div class="input-group">
            <label for="numero2">Número 2</label>
            <input type="number" id="numero2" placeholder="Digite o segundo número">
        </div>

        <div class="botoes">
            <button onclick="somar()">Somar</button>
            <button onclick="subtrair()">Subtrair</button>
            <button onclick="multiplicar()">Multiplicar</button>
            <button onclick="dividir()">Dividir</button>
        </div>

        <div id="resultado">Deseja calcular algo?</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
